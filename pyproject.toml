[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-gdn-optimizations"
version = "0.1.0"
description = "Default-off GDN optimization MOD family for vLLM-HUST"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
gdn_optimizations = "vllm_hust_gdn_optimizations:load"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
